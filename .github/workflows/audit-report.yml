# On-demand audit report: prints recent audit-trail entries to the run log.
name: Audit report
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "7"
      actor:
        description: "Filter by person (name/email substring, optional)"
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DAYS: ${{ github.event.inputs.days }}
      ACTOR: ${{ github.event.inputs.actor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsx scripts/audit-report.ts
